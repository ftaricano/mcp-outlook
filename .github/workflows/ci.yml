name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --reporter=default

      - name: Smoke test (MCP protocol)
        run: npm run smoke

      - name: Smoke test (read-only plugin stdio)
        run: npm run smoke:plugin

      - name: Smoke test (read-only plugin HTTP)
        run: npm run smoke:http

      - name: Validate published package contents
        run: npm pack --dry-run

      - name: Coverage
        if: matrix.node == '20'
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node == '20'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Free for repositories owned by a personal account. Known false positives
      # (synthetic test fixtures) are listed by fingerprint in .gitleaksignore.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: false

  audit:
    name: Dependency audit (prod only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts prevents the `prepare` hook (which runs tsc) from
      # executing without devDependencies available, avoiding a false failure.
      - run: npm ci --omit=dev --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
